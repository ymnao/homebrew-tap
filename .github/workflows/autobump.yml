# `brew tap-new` が生成する autobump テンプレート (Homebrew 7.0.9) をもとにしている。
# テンプレートとの差分:
# - formulae ではなく casks を対象にする (この tap は Cask のみ)。formula 専用の
#   --bump-synced は外す
# - runner を ubuntu-latest ではなく macOS にする。bump 時の `brew audit` が dmg を
#   hdiutil で開き、plutil で LSMinimumSystemVersion を読むため (どちらも macOS 専用)
# - 手動実行用に workflow_dispatch を足す
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 19:40 UTC
    - cron: 40 19 * * *
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --casks --tap="$TAP_NAME"
